name: CI

on:
  pull_request:
  push:
    branches:
      - "**"
    tags:
      - "RELEASE.*"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/RELEASE.') }}

jobs:
  detect-go-changes:
    name: Detect Go code changes
    runs-on: ubuntu-latest
    outputs:
      go_changed: ${{ startsWith(github.ref, 'refs/tags/RELEASE.') || steps.filter.outputs.go == 'true' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect Go changes
        id: filter
        if: ${{ !startsWith(github.ref, 'refs/tags/RELEASE.') }}
        uses: dorny/paths-filter@v4
        with:
          # On pushes, compare with the previous commit on the same branch.
          # For pull requests, paths-filter uses the PR base automatically.
          base: ${{ github.ref }}
          filters: |
            go:
              - '**/*.go'
              - '**/*.sh'
              - '**/*.yml'
              - '**/*.yaml'
              - 'go.mod'
              - 'go.sum'

  unit:
    name: Unit tests on Go ${{ matrix.go-version }} and ${{ matrix.os }}
    needs: [detect-go-changes]
    if: needs.detect-go-changes.outputs.go_changed == 'true'
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Build and run unit tests
        run: |
          go build --ldflags="-s -w" .
          go test -v -race --timeout 30m ./...

  vulncheck:
    name: Vulnerability analysis
    needs: [detect-go-changes]
    if: needs.detect-go-changes.outputs.go_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck ./...

  build-linux-amd64-for-integration:
    name: Build Linux AMD64 integration binary
    needs: [detect-go-changes]
    if: needs.detect-go-changes.outputs.go_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux AMD64 binary
        run: .github/scripts/build-linux-amd64.sh mc-linux-amd64

      - name: Upload Linux AMD64 binary
        uses: actions/upload-artifact@v7
        with:
          name: mc-linux-amd64-${{ github.run_id }}
          path: mc-linux-amd64
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  integration:
    name: Integration tests with ${{ matrix.backend }}
    needs:
      [detect-go-changes, unit, vulncheck, build-linux-amd64-for-integration]
    if: needs.detect-go-changes.outputs.go_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [minio-legacy, rustfs, garage, seaweedfs, versitygw, aistor]
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: mc-linux-amd64-${{ github.run_id }}
          path: .integration

      - name: Install Linux binary
        run: install -m 0755 .integration/mc-linux-amd64 mc

      - name: Run integration tests
        env:
          AISTOR_LICENSE: ${{ secrets.AISTOR_LICENSE }}
        run: .github/scripts/run-integration-tests.sh "${{ matrix.backend }}" "$GITHUB_WORKSPACE/mc"

  goreleaser:
    name: Build release artifacts with Goreleaser
    if: >-
      needs.detect-go-changes.outputs.go_changed == 'true' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/RELEASE.'))
    needs: [detect-go-changes, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build snapshot artifacts on master
        if: github.ref == 'refs/heads/master'
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --snapshot --skip=publish

      - name: Build tagged artifacts
        if: startsWith(github.ref, 'refs/tags/RELEASE.')
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish --skip=validate

      - name: Upload build outputs
        uses: actions/upload-artifact@v7
        with:
          name: mc-dist-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/RELEASE.')
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: mc-dist-${{ github.run_id }}
          path: dist

      - name: Stage release assets
        run: |
          set -euo pipefail

          # Stage archives without a version part in the filename.
          # Goreleaser may still emit versioned paths/names, so derive stable
          # asset names per platform instead of reusing .name.
          rm -rf release-assets
          mkdir -p release-assets

          while IFS=$'\t' read -r path goos goarch format; do
            [[ -n "$path" && -n "$goos" && -n "$goarch" && -n "$format" ]]

            name="mc-${goos}-${goarch}"
            case "$format" in
              zip) name="${name}.zip" ;;
              tar.gz) name="${name}.tar.gz" ;;
              *) echo "Unsupported archive format: $format" >&2; exit 1 ;;
            esac

            cp -- "$path" "release-assets/$name"
          done < <(
            jq -r '
              .[]
              | select(.type == "Archive" and (.extra.Format == "tar.gz" or .extra.Format == "zip"))
              | [.path, .goos, .goarch, .extra.Format]
              | @tsv
            ' dist/artifacts.json
          )

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Version ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
